name: Peetri Pizza — release check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/peetripizza/**'
      - 'patches/**'
      - '.github/workflows/peetri-release-check.yml'
  push:
    branches: [main]
    paths:
      - 'app/peetripizza/**'
      - 'patches/**'
      - '.github/workflows/peetri-release-check.yml'

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify release package (read only)
        shell: bash
        run: |
          set -euo pipefail
          php -r '$m=require "app/peetripizza/tools/release-manifest.php"; if (!is_array($m)) exit(1); echo json_encode($m, JSON_THROW_ON_ERROR);' > "$RUNNER_TEMP/peetri-manifest.json"
          python3 - "$RUNNER_TEMP/peetri-manifest.json" <<'PY'
          import hashlib, json, os, pathlib, re, sys
          root = pathlib.Path("app/peetripizza")
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          errors = []
          dashboard = root / "dashboard.php"
          match = re.search(r'name="peetri-release"\s+content="([0-9.]+)"', dashboard.read_text(encoding="utf-8"))
          version = match.group(1) if match else "UNKNOWN"
          if not match:
              errors.append("Release marker missing in dashboard.php")
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not manifest:
              errors.append("Release manifest is empty")
          for name, expected in manifest.items():
              rel = pathlib.PurePosixPath(name)
              if rel.is_absolute() or ".." in rel.parts:
                  errors.append(f"Unsafe manifest path: {name}")
                  continue
              path = root / rel
              if not path.is_file():
                  errors.append(f"Missing: {name}")
              elif hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  errors.append(f"SHA-256 mismatch: {name}")
          patch = pathlib.Path("patches/update-latest-ssh.txt")
          if not patch.is_file() or patch.stat().st_size == 0:
              errors.append("Latest SSH patch missing or empty")
          patch_mb = patch.stat().st_size / 1_000_000 if patch.is_file() else 0
          report = [
              "# Peetri Pizza — Release check",
              "",
              f"- Repository version: **{version}**",
              f"- Manifest entries checked: **{len(manifest)}**",
              f"- Latest patch size: **{patch_mb:.2f} MB**",
              f"- Result: **{'FAILED' if errors else 'PASSED'}**",
              "- Production server: **not accessed**",
              "- Application files: **not modified**",
          ]
          if errors:
              report += ["", "## Problems"] + [f"- {e}" for e in errors[:30]]
          summary.write_text("\n".join(report) + "\n")
          print("\n".join(report))
          if errors:
              raise SystemExit(1)
          PY
